<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-sidebar-cards · preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#eef0f2;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;padding:16px;color:#1f2124}
  .sidebar{width:288px;background:#fafafa;border-radius:12px;padding:8px 4px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 18px rgba(0,0,0,.10)}
  .brand{display:flex;align-items:center;gap:6px;padding:6px 8px 10px}
  .mark{width:24px;height:24px}
  .word{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#111}
  .badge{background:#111;color:#fff;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 5px;border-radius:3px;margin-left:2px;transform:translateY(-1px)}
  .newchat{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 4px 4px;background:#f1f1f2;border:1px solid #e6e6e7;border-radius:9px;font-size:14px;color:#1f1f1f}
  .newchat .kbd{margin-left:auto;font-size:11px;color:#9b9b9b}
  .card{background:#fff;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.05);overflow:hidden}
  .head{position:relative;display:flex;align-items:center;height:30px;padding:0 12px;border-radius:8px 8px 0 0;overflow:hidden}
  .title{font-size:15px;font-weight:700;position:relative;z-index:2}
  .count{font-size:11px;font-weight:600;border-radius:9px;padding:1px 6px;margin-left:7px;position:relative;z-index:2}
  .arrow{margin-left:auto;display:grid;place-items:center;width:20px;height:20px;position:relative;z-index:2}
  .body{padding:4px 4px 6px}
  .row{display:flex;align-items:center;gap:7px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;color:#262626}
  .row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:11px;color:#a5a5a5}
  .day{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;font-size:11px;color:#9a9a9a}
  .day:after{content:"";flex:1;height:1px;background:rgba(0,0,0,.05)}
  .prow{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font-size:13.5px;color:#2d2d2d}
  .prow .ico{width:16px;height:16px;display:grid;place-items:center;color:#5d5d5d}
  .ws{display:flex;align-items:center;gap:7px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;color:#1f1f1f}
  .ws .ico{width:14px;height:14px;color:#8b8b8b;display:grid;place-items:center}
  .ws .n{flex:1;font-weight:600;font-size:13px}
  .ws .c{font-size:11px;color:#a2a2a2}
  .ws .plus{color:#e9e9e9;width:20px;height:20px;display:grid;place-items:center}
  .ws .arr{width:20px;height:20px;display:grid;place-items:center;color:#5a5a5a}
  .wsbody{padding-left:14px}
  .hacts{margin-left:auto;display:flex;align-items:center;gap:6px;color:#4d4d4d}
  .hact{width:20px;height:20px;display:grid;place-items:center}
  .gram{background:linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,.10) 100%),radial-gradient(90% 140% at 15% -25%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 60%),linear-gradient(135deg,#E6EAEE 0%,#D3D7DB 100%);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.06)}
  .concrete{background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 38%),radial-gradient(85% 130% at 16% -25%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 58%),linear-gradient(0deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 9%),linear-gradient(160deg,#EBEBEB 0%,#DCDDDF 55%,#C4C5C7 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24"><path d="M12 2c4.6 0 8.2 3.2 8.2 7.6 0 1.5-.3 2.6-.9 3.6l1.9 2.5c.3.4 0 .9-.5.9h-2.1c-1.2 1.9-3.6 3.2-6.6 3.2-4.6 0-8.2-3.2-8.2-7.6S7.4 2 12 2z" fill="#111"/><circle cx="9.2" cy="9.6" r="1.15" fill="#fff"/></svg>
    <span class="word">deepseek</span><span class="badge">HARNESS</span>
  </div>
  <div class="newchat"><span>⊕</span><span>新会话</span><span class="kbd">Ctrl + N</span></div>

  <div class="card">
    <div class="head gram"><span class="title">插件</span><span class="arrow">›</span></div>
    <div class="body">
      <div class="prow"><span class="ico">▦</span>插件</div>
      <div class="prow"><span class="ico">◷</span>自动化任务</div>
      <div class="prow"><span class="ico">▤</span>作品</div>
      <div class="prow"><span class="ico">⋯</span>更多</div>
      <div class="prow"><span class="ico">●</span>DS Bot</div>
    </div>
  </div>

  <div class="card">
    <div class="head concrete"><span class="title">一周会话</span><span class="count">12</span><span class="arrow">⌄</span></div>
    <div class="body">
      <div class="day">今天</div>
      <div class="row"><span class="t">示例会话 · 周报整理</span><span class="time">刚刚</span></div>
      <div class="row"><span class="t">示例会话 · 接口排查</span><span class="time">2时</span></div>
      <div class="day">昨天</div>
      <div class="row"><span class="t">示例会话 · 插件打包</span><span class="time">昨天</span></div>
      <div class="day">本周</div>
      <div class="row"><span class="t">示例会话 · 文档校对</span><span class="time">2天</span></div>
      <div class="row"><span class="t">示例会话 · 数据导出</span><span class="time">3天</span></div>
    </div>
  </div>

  <div class="card">
    <div class="head gram"><span class="title">置顶会话</span><span class="count">5</span><span class="arrow">›</span></div>
  </div>
  <div class="card">
    <div class="head gram"><span class="title">自动化任务会话</span><span class="count">3</span><span class="arrow">›</span></div>
  </div>

  <div class="card">
    <div class="head gram"><span class="title">工作区</span><span class="hacts"><span class="hact">⌕</span><span class="hact">≡</span><span class="hact">＋</span></span><span class="arrow">⌄</span></div>
    <div class="body">
      <div class="ws"><span class="ico">▭</span><span class="n">示例工作区 A</span><span class="c">18</span><span class="plus">＋</span><span class="arr">⌄</span></div>
      <div class="wsbody">
        <div class="row"><span class="t">示例会话 · 需求梳理</span><span class="time">1时</span></div>
        <div class="row"><span class="t">示例会话 · 联调记录</span><span class="time">昨天</span></div>
        <div class="row"><span class="t">示例会话 · 版本发布</span><span class="time">4天</span></div>
      </div>
      <div class="ws"><span class="ico">▭</span><span class="n">示例工作区 B</span><span class="c">9</span><span class="plus">＋</span><span class="arr">⌄</span></div>
      <div class="wsbody">
        <div class="row"><span class="t">示例会话 · 素材整理</span><span class="time">3天</span></div>
        <div class="row"><span class="t">示例会话 · 脚本调试</span><span class="time">1周</span></div>
      </div>
      <div class="ws"><span class="ico">▭</span><span class="n">示例工作区 C</span><span class="c">4</span><span class="plus">＋</span><span class="arr">›</span></div>
    </div>
  </div>
</div>
</body>
</html>
